<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "Library" }} - Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block bodyclass %}{% endblock %}">
    <header>
        <a class="brand" href="{{ url_for('index') }}">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span>Library</span>
        </a>
        {% if session.get('user_id') %}
        <nav>
            <a href="{{ url_for('search') }}">Search</a>
            <a href="{{ url_for('catalogue') }}">Catalogue</a>
            <a href="{{ url_for('reports') }}">Reports</a>
            <a href="{{ url_for('loans') }}">Loans</a>
            <a href="{{ url_for('most_borrowed') }}">Most borrowed</a>
            <a href="{{ url_for('authors_books') }}">Authors</a>
        </nav>
        <form class="userbox" method="post" action="{{ url_for('logout') }}">
            <span>Hi, {{ session.get('name') }}</span>
            <button type="submit" class="small">Log out</button>
        </form>
        {% endif %}
    </header>
    <main>
        <h1>{{ title }}</h1>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>

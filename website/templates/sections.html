{% for s in sections %}
<section>
    <h2>{{ s.heading }}</h2>
    {% if s.rows %}
    <div class="table-wrap">
        <table>
            <thead><tr>{% for c in s.cols %}<th>{{ c }}</th>{% endfor %}</tr></thead>
            <tbody>
                {% for row in s.rows %}
                <tr>{% for v in row %}<td>{{ v if v is not none else "-" }}</td>{% endfor %}</tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <p class="empty">No results.</p>
    {% endif %}
</section>
{% endfor %}
